# Keep sheriff-call awake during Bali daytime (07:00–21:00 WITA = 23:00–13:00 UTC).
# To activate: move this file to .github/workflows/keepalive.yml (needs a GitHub token with the "workflow" scope).
name: keep-alive
on:
  schedule:
    - cron: "*/10 23 * * *"
    - cron: "*/10 0-12 * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - run: curl -fsS --max-time 90 --retry 2 https://sheriff-call.onrender.com/healthz
